server:
  address: 127.0.0.1
  port: ${MEDIA_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: media-service
  config:
    import:
      - optional:nacos:media-service.yaml?group=MEDIA&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:lifemap-dev}
        group: MEDIA
        metadata:
          version: 1.0.0
      config:
        namespace: ${NACOS_NAMESPACE:lifemap-dev}
        group: MEDIA
        file-extension: yaml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/media_db
    username: ${POSTGRES_USER:lifemap}
    password: ${POSTGRES_PASSWORD:lifemap_dev_2026}
    hikari:
      pool-name: media-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
  servlet:
    multipart:
      # 业务口径是单张 20MB、单次 9 张（见 PhotoUploadService）。这里刻意留高：
      # 容器先拒的话，超限请求到不了校验逻辑，返回的就不是 10413 而是 500/413。
      max-file-size: 30MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 练手阶段看真实 SQL；P7 上生产前关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

lifemap:
  storage:
    # 前缀用 s3 而不是 rustfs：换实现只改 endpoint，配置结构不动
    s3:
      endpoint: http://${RUSTFS_HOST:127.0.0.1}:${RUSTFS_API_PORT:9000}
      access-key: ${RUSTFS_ACCESS_KEY:lifemap}
      secret-key: ${RUSTFS_SECRET_KEY:lifemap_dev_2026}
      bucket: ${RUSTFS_BUCKET:lifemap}
      # 预签名地址有效期；S3 的 signatureDuration 上限 7 天，这里压到 1 小时
      presign-ttl: 1h
      # 原图与缩略图同桶不同前缀，按 年/月/uuid 分片，避免单目录膨胀
      origin-prefix: originals
      webp-prefix: webp
      thumb-prefix: thumbs

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.alibaba.nacos: warn
