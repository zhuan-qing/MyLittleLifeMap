# P0 中间件编排：PostgreSQL / Redis / RustFS / Nacos
#
# 只负责"稳定依赖"，四个业务服务在宿主机用 JVM 跑（改代码热重启，不必反复打镜像）。
# 全部端口只绑 127.0.0.1，本机自用，不对局域网暴露。
#
# 启动：docker compose --env-file .env up -d
# 状态：docker compose ps
# 关闭：docker compose down            （保留数据卷）
# 清空：docker compose down -v         （连数据卷一起删，危险）

name: ${COMPOSE_PROJECT_NAME:-lifemap}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    # 镜像地址走 .env，国内直连 Docker Hub 常被拦，换源只改 .env 一行
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    container_name: lifemap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifemap_dev_2026}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      # 只绑回环：同一个 Wi-Fi 下的其他设备摸不到数据库
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 挂父目录而不是 .../data：PG 18 起官方镜像把 PGDATA 移到了 /var/lib/postgresql/18/docker，
      # 挂父目录对 17/18 都成立，不会出现"升级镜像后数据丢失"
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    logging: *default-logging
    networks: [lifemap-net]

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: lifemap-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lifemap_dev_2026}
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-lifemap_dev_2026}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # 留 32MB 给容器自身开销，避免 maxmemory 顶到 mem_limit 被 OOM Kill
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging
    networks: [lifemap-net]

  # 对象存储：RustFS（Apache 2.0，S3 兼容）。替换了原来的 MinIO——社区版已停维护。
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0}
    container_name: lifemap-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lifemap}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lifemap_dev_2026}
      # S3 API 与控制台分开监听；控制台路径带前缀 /rustfs/console/
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      TZ: Asia/Shanghai
    # 唯一的位置参数是数据目录，与镜像默认的 RUSTFS_VOLUMES 一致
    command: ["/data"]
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      # 用命名卷而不是宿主目录：容器以 uid 10001 运行，挂宿主目录要先 chown
      - rustfsdata:/data
      - rustfslogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    logging: *default-logging
    networks: [lifemap-net]

  # S3 命令行工具（mc）。不是服务端，常驻只为 docker compose exec 方便：
  # 建桶、查对象、跑备份。桶的初始化由 media-service 启动时自己做，这里只做人工排查。
  s3cli:
    image: ${MC_IMAGE:-minio/mc:latest}
    container_name: lifemap-s3cli
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      # mc 认 MC_HOST_<别名>，省掉每次 mc alias set
      MC_HOST_local: "http://${RUSTFS_ACCESS_KEY:-lifemap}:${RUSTFS_SECRET_KEY:-lifemap_dev_2026}@rustfs:9000"
    mem_limit: 32m
    logging: *default-logging
    networks: [lifemap-net]

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v2.3.2}
    container_name: lifemap-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # 仅开发环境关闭鉴权；P7 上生产前必须置为 true 并配置 token.secret.key
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      NACOS_SERVER_PORT: 8848
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"       # HTTP 控制台与 OpenAPI
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"  # 客户端 gRPC（2.x 必需，端口 = 8848 + 1000）
    volumes:
      - nacosdata:/home/nacos/data
      - nacoslogs:/home/nacos/logs
    healthcheck:
      # 判 HTTP 状态码而不是响应体：Nacos 2.3 的 readiness 返回正文是 "OK"，
      # 不是 "UP"（actuator 那套才是 UP），按 body 匹配会一直误判 unhealthy
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    logging: *default-logging
    networks: [lifemap-net]

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  rustfslogs:
  nacosdata:
  nacoslogs:

networks:
  lifemap-net:
    driver: bridge
