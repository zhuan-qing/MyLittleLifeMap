# P0 中间件编排：PostgreSQL / Redis / MinIO / Nacos
#
# 只负责"稳定依赖"，四个业务服务在宿主机用 JVM 跑（改代码热重启，不必反复打镜像）。
# 全部端口只绑 127.0.0.1，本机自用，不对局域网暴露。
#
# 启动：docker compose --env-file .env up -d
# 状态：docker compose ps
# 关闭：docker compose down            （保留数据卷）
# 清空：docker compose down -v         （连数据卷一起删，危险）

name: ${COMPOSE_PROJECT_NAME:-lifemap}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-18.6}
    container_name: lifemap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifemap_dev_2026}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      # 只绑回环：同一个 Wi-Fi 下的其他设备摸不到数据库
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 挂父目录而不是 .../data：PG 18 起官方镜像把 PGDATA 移到了 /var/lib/postgresql/18/docker，
      # 挂父目录对 17/18 都成立，不会出现"升级镜像后数据丢失"
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    logging: *default-logging
    networks: [lifemap-net]

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.4-alpine}
    container_name: lifemap-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lifemap_dev_2026}
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-lifemap_dev_2026}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # 留 32MB 给容器自身开销，避免 maxmemory 顶到 mem_limit 被 OOM Kill
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging
    networks: [lifemap-net]

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    container_name: lifemap-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: Asia/Shanghai
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # minio 镜像自带 mc，官方推荐用 mc ready；curl 兜底防镜像变体没带 mc
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    logging: *default-logging
    networks: [lifemap-net]

  # 一次性任务：建桶 + 关掉匿名访问。跑完即退出，不占常驻资源
  minio-init:
    image: minio/mc:${MC_IMAGE_TAG:-latest}
    container_name: lifemap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-lifemap}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc mb --ignore-existing "local/$$MINIO_BUCKET-backup"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "buckets ready:"
        mc ls local
    restart: "no"
    logging: *default-logging
    networks: [lifemap-net]

  nacos:
    image: nacos/nacos-server:${NACOS_IMAGE_TAG:-v2.3.2}
    container_name: lifemap-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # 仅开发环境关闭鉴权；P7 上生产前必须置为 true 并配置 token.secret.key
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      NACOS_SERVER_PORT: 8848
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"       # HTTP 控制台与 OpenAPI
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"  # 客户端 gRPC（2.x 必需，端口 = 8848 + 1000）
    volumes:
      - nacosdata:/home/nacos/data
      - nacoslogs:/home/nacos/logs
    healthcheck:
      # curl / wget 都试一遍：不同 nacos 镜像变体的基础镜像不一样，避免因缺工具误判不健康
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness 2>/dev/null | grep -q UP
          || wget -qO- http://127.0.0.1:8848/nacos/v1/console/health/readiness 2>/dev/null | grep -q UP
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    logging: *default-logging
    networks: [lifemap-net]

volumes:
  pgdata:
  redisdata:
  miniodata:
  nacosdata:
  nacoslogs:

networks:
  lifemap-net:
    driver: bridge
