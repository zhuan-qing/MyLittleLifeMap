server:
  # 本机自用，只绑回环，不对局域网暴露
  address: 127.0.0.1
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  config:
    # 配置中心优先级：本地 application.yaml 是兜底默认值，Nacos 上的同名配置作为环境覆盖
    import:
      - optional:nacos:gateway.yaml?group=GATEWAY&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:lifemap-dev}
        # 注册与发现必须同一个 group：配置按服务拆 group（GATEWAY/PLACE/MEDIA/STATS）
        # 互不干扰，但如果注册也按服务拆，网关只能在自己那一组里查 place-service，
        # 结果是永远查不到 → 所有 lb:// 路由 503。所以注册统一 DEFAULT_GROUP。
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        namespace: ${NACOS_NAMESPACE:lifemap-dev}
        group: GATEWAY
        file-extension: yaml
    gateway:
      discovery:
        locator:
          # 关闭按服务名自动路由，路由表显式声明，避免内网接口被意外暴露
          enabled: false
          lower-case-service-id: true
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      # 路由表：兜底默认值（服务名不随环境变，端口由 Nacos 注册表解析）。
      # Nacos GATEWAY/gateway.yaml 里有同样一份，那份优先——改路由以 Nacos 为准，
      # 改完重跑 scripts/nacos-init.sh，并同步这里，否则 Nacos 不可用时行为不一样。
      # 注意：Nacos 覆盖是整条列表覆盖，不是逐条合并，两份必须保持一致。
      # 故意没有 /internal/**：内部接口只给服务之间调（place↔media、place↔stats），
      # 从 8080 打进来应该 404，而不是被顺手转发出去。
      routes:
        # 1) 照片（media-service）。必须排在 places 那条前面：
        #    /api/places/1/photos 同时命中 /api/places/**，靠"更精确的断言先匹配"区分。
        #    /api/places/*/photos 里的 * 只吃一个路径段，与 /api/places/** 不会双命中，
        #    顺序只是第二层保险。
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/places/*/photos,/api/photos/**
        # 2) 地点、地理编码、登录、导出（place-service）。
        #    /api/login 与 /api/export 是精确路径，不用 /**：导出只有一个端点。
        - id: place-service
          uri: lb://place-service
          predicates:
            - Path=/api/places/**,/api/geo/**,/api/login,/api/export
        # 3) 统计与点亮（stats-service）
        - id: stats-service
          uri: lb://stats-service
          predicates:
            - Path=/api/stats/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.alibaba.nacos: warn
